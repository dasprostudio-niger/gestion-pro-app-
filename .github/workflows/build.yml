name: Build Signed APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    
    - name: Prepare www folder
      run: |
        mkdir -p www
        cp index.html www/
        cp manifest.json www/
        cp service-worker.js www/
        cp premium.js www/
        cp qrcode.min.js www/
        cp html5-qrcode.min.js www/
        cp html2canvas.min.js www/
        cp launchericon-*.png www/ 2>/dev/null || true
    
    - name: Install Capacitor
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/camera
    
    - name: Initialize Capacitor
      run: |
        npx cap init "Gestion Pro" "com.dasprostudio.gestionproapp" --web-dir=www
    
    - name: Add Android platform
      run: |
        npx cap add android
        npx cap sync android
    
    - name: Set version code and name
      run: |
        GRADLE="android/app/build.gradle"
        sed -i 's/versionCode 1/versionCode 2/' "$GRADLE"
        sed -i 's/versionName "1.0"/versionName "1.0.1"/' "$GRADLE"
        echo "=== Version mise à jour ==="
        grep -E "versionCode|versionName" "$GRADLE" || true
    
    - name: Add camera permissions to AndroidManifest
      run: |
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        sed -i 's|</manifest>|<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>|' "$MANIFEST"
    
    - name: Fix WebView recreation on app resume
      run: |
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        echo "=== Avant modification ==="
        cat "$MANIFEST"
        
        # Ajouter configChanges pour éviter la recréation de l'activité
        python3 -c "
import re
manifest_path = 'android/app/src/main/AndroidManifest.xml'
with open(manifest_path, 'r', encoding='utf-8') as f:
    content = f.read()

# Liste des changements de configuration à gérer
config_changes = 'orientation|screenSize|keyboardHidden|keyboard|screenLayout|smallestScreenSize|uiMode|density|fontScale|locale|layoutDirection'

# Remplacer toutes les balises <activity par <activity avec les configChanges
content = re.sub(
    r'<activity(?!\s+android:configChanges)',
    '<activity android:configChanges=\"' + config_changes + '\"',
    content
)

# Forcer launchMode singleTask pour garder l'app en mémoire
content = re.sub(
    r'<activity(?!.*android:launchMode)',
    '<activity android:launchMode=\"singleTask\"',
    content,
    count=1
)

with open(manifest_path, 'w', encoding='utf-8') as f:
    f.write(content)
"
        
        echo "=== Après modification ==="
        cat "$MANIFEST"
    
    - name: Build APK release
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease
    
    - name: Align and sign APK
      run: |
        BT=$(ls $ANDROID_SDK_ROOT/build-tools/ | tail -1)
        ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/$BT/zipalign"
        APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$BT/apksigner"
        
        mkdir -p signed
        cd android/app/build/outputs/apk/release
        
        $ZIPALIGN -v 4 app-release-unsigned.apk $GITHUB_WORKSPACE/signed/app-aligned.apk
        
        cd $GITHUB_WORKSPACE/signed
        zip -d app-aligned.apk "META-INF/*.RSA" "META-INF/*.SF" "META-INF/*.MF" || true
        
        $APKSIGNER sign \
          --ks $GITHUB_WORKSPACE/gestionpro.keystore \
          --ks-pass pass:gestionpro2026 \
          --key-pass pass:gestionpro2026 \
          --ks-key-alias gestionpro \
          --out GestionPro-signed.apk \
          app-aligned.apk
        
        $APKSIGNER verify --verbose GestionPro-signed.apk
        ls -la GestionPro-signed.apk
    
    - name: Upload signed APK
      uses: actions/upload-artifact@v4
      with:
        name: GestionPro-APK-Signed
        path: signed/GestionPro-signed.apk
