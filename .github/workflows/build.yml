name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    
    - name: Prepare www folder
      run: |
        mkdir -p www/common
        cp index.html www/
        cp manifest.json www/
        cp service-worker.js www/
        cp premium.js www/
        cp qrcode.min.js www/
        cp html5-qrcode.min.js www/
        cp html2canvas.min.js www/
        cp launchericon-*.png www/ 2>/dev/null || true
        cp logo.png www/common/ 2>/dev/null || true
    
    - name: Install Capacitor
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/camera
    
    - name: Initialize Capacitor
      run: |
        npx cap init "Gestion Pro" "com.dasprostudio.gestionpro" --web-dir=www
    
    - name: Add Android platform
      run: |
        npx cap add android
        npx cap sync android
    
    - name: Add camera permissions to AndroidManifest
      run: |
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        sed -i 's|</manifest>|<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>|' "$MANIFEST"
        echo "=== AndroidManifest.xml après modification ==="
        cat "$MANIFEST"
    
    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: GestionPro-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
